# Перенаправляем HTTP на HTTPS
server {
    listen 80;
    server_name elan.localhost;
    return 301 https://$host$request_uri;
}

# Основной сервер с HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name elan.localhost;

    # Пути к нашим сертификатам
    ssl_certificate     /etc/nginx/certs/elan.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/elan.localhost-key.pem;

    # Сжатие
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Раздача React-приложения
    location / {
        root /usr/share/nginx/html;
        index index.html;
        
        # Важно для React Router! Если файл не найден, отдаем index.html
        try_files $uri $uri/ /index.html;
    }
}