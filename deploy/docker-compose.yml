services:
  frontend:
    build: ../frontend
    restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - frontend
    restart: unless-stopped